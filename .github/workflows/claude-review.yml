name: Claude PR review

# Stage 5 (Deploy): runs the review passes defined in REVIEW.md on every PR,
# and lets authors request fixes by tagging @claude on a review comment.
#
# Requires an ANTHROPIC_API_KEY secret (Settings → Secrets and variables →
# Actions). See https://github.com/anthropics/claude-code-action for the
# action's full configuration surface.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    # Full review on new/updated PRs; targeted response when someone tags
    # @claude on a comment (Stage 5's "response loop").
    if: >
      github.event_name == 'pull_request' ||
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Point the action at this repo's review policy rather than a
          # generic prompt — REVIEW.md defines passes, severity, and the
          # nit cap.
          prompt: |
            Review this pull request following the policy in REVIEW.md at
            the root of this repo: run the Bugs, Security, and Compliance
            passes in that order, rank findings Important vs. Nit, respect
            the nit cap, and skip the excluded paths it lists. If a
            plans/*.plan.md exists for this branch, check the diff against
            it as part of the Compliance pass.
